# Integração contínua da API: análise estática e testes (sem deploy).
#
# Roda em todo pull request e push para os branches da convenção do projeto
# (develop → pre-prod → main). Os jobs "Lint" e "Testes" são os status checks
# exigidos pela proteção de branches (RNF NFSE11).

name: CI

on:
  pull_request:
    branches: [develop, pre-prod, main]
  push:
    branches: [develop, pre-prod, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Hooks do Husky são locais; no CI as verificações rodam explicitamente.
  HUSKY: '0'
  # Usada apenas pela validação sintática do schema Prisma (sem conexão).
  DATABASE_URL: mongodb://localhost:27017/bios_ci?directConnection=true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: o commitlint precisa dos commits da base e do head
          # do PR para validar todas as mensagens do intervalo.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      # O lockfile é gerado com o npm 11. O npm 10 que acompanha o Node 22 resolve
      # dependências peer opcionais de outra forma e rejeita o lockfile no `npm ci`.
      - name: Alinhar versão do npm com a do lockfile
        run: npm install -g npm@11

      - name: Instalar dependências
        run: npm ci

      - name: Mensagens de commit (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Título do pull request (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

      - name: Schema Prisma (formatação e validação)
        run: |
          npx prisma format --check
          npx prisma validate

      - name: ESLint (NFSE10)
        run: npm run lint:check -- --max-warnings=0

      - name: Prettier
        run: npm run format:check

      - name: Verificação de tipos
        run: npm run typecheck

  test:
    name: Testes
    # Fixo no Ubuntu 22.04, e não em `ubuntu-latest`, de propósito: do kernel 6.19
    # ao 7.0.13 o MongoDB 8 se recusa a iniciar (incompatibilidade do tcmalloc com
    # o kernel, SERVER-121912; resolvida no kernel 7.0.14). O `ubuntu-latest`
    # passou a usar um kernel dessa faixa, e o e2e não subia o banco. Quando o
    # runner novo trouxer o kernel 7.0.14 ou mais, dá para voltar ao `latest`.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      # O lockfile é gerado com o npm 11. O npm 10 que acompanha o Node 22 resolve
      # dependências peer opcionais de outra forma e rejeita o lockfile no `npm ci`.
      - name: Alinhar versão do npm com a do lockfile
        run: npm install -g npm@11

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários e de integração (cobertura mínima de 75% — NFPD03)
        run: npm run test:cov

      # O kernel do runner decide se o MongoDB 8 inicia (ver `runs-on` acima);
      # registrá-lo deixa a causa óbvia se o banco voltar a não subir.
      - name: Kernel do runner
        run: uname -r

      # Download das mesmas imagens oficiais, fixadas por digest (.github/ci-images.lock),
      # por registros alternativos.
      - name: Validar fallback dos registros de imagens
        run: bash .github/scripts/pull-ci-images.test.sh

      - name: Validar atualização do lock de imagens
        run: bash .github/scripts/update-ci-images.test.sh

      - name: Obter imagens da infraestrutura de teste
        run: bash .github/scripts/pull-ci-images.sh

      # --pull never usa as imagens obtidas, sem consultar o registro novamente.
      # --wait exige MongoDB primário e Redis respondendo ao ping.
      - name: Infraestrutura de teste (MongoDB em replica set e Redis)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --detach --wait --pull never mongodb redis

      # Se um contêiner sair com erro, o `--wait` só informa o código de saída;
      # o motivo está no log do próprio serviço.
      - name: Logs da infraestrutura (somente em falha)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=200 mongodb redis

      - name: Testes e2e (pipeline HTTP e banco real)
        run: npm run test:e2e

      - name: Resumo de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e "
            const { total } = require('./coverage/coverage-summary.json');
            const rows = ['lines', 'statements', 'functions', 'branches']
              .map((metric) => '| ' + metric + ' | ' + total[metric].pct + '% |');
            console.log(['### Cobertura de testes', '', '| Métrica | Cobertura |', '| --- | --- |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
