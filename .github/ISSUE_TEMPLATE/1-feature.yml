name: Tarefa de desenvolvimento
description: Implementação de funcionalidade da API a partir dos artefatos de análise do bios-docs.
title: '[FEAT] '
labels: [back-end, feature]
projects: [odavibatista/15]

body:
  - type: markdown
    attributes:
      value: |
        Preencha a partir dos artefatos do repositório **bios-docs**. Os campos de artefato aceitam o
        Markdown original **colado como está (Ctrl+V)**: tabelas HTML dos casos de uso, quadros de
        requisitos e blocos ` ```mermaid ` são renderizados na issue.

  - type: dropdown
    id: module
    attributes:
      label: Módulo
      options:
        - accounts
        - authentication
        - api-keys
        - security
        - mailing
        - data-sources
        - evidences
        - companies
        - scoring
        - shared (infraestrutura transversal)
    validations:
      required: true

  - type: input
    id: traceability
    attributes:
      label: Rastreabilidade
      description: IDs dos artefatos atendidos por esta tarefa.
      placeholder: UC02, RF02, RF19, RF20, HU03, HU09, NFSE06
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: O que esta entrega habilita, em uma ou duas frases.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Caso de uso
      description: >-
        Cole a tabela completa do caso de uso (08-Artefatos-de-Análise.md, seção 8.2), da tag
        <table> até </table>.
    validations:
      required: false

  - type: textarea
    id: requirements
    attributes:
      label: Requisitos
      description: >-
        Cole os blocos dos requisitos atendidos — título e tabela de cada RF
        (05-Requisitos-Funcionais.md) e os itens de RNF (06) e RIN (07).
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: Histórias de usuário
      description: >-
        Cole as linhas do Quadro 3 (04-Atores-e-Histórias-dos-Usuários.md) abaixo do cabeçalho,
        que já está preenchido.
      value: |
        | ID | Eu como... | Gostaria de... | Para... | Requisitos relacionados |
        | ------------ | ------------ | ------------ | ------------ | ------------ |
    validations:
      required: false

  - type: textarea
    id: diagrams
    attributes:
      label: Diagramas de referência
      description: >-
        Cole diagramas de sequência ou trechos do diagrama de classes com as cercas ```mermaid
        e/ou o trecho da entidade no DBML (assets/database/bios-database.dbml.txt) entre cercas ```.
    validations:
      required: false

  - type: textarea
    id: technical-scope
    attributes:
      label: Escopo técnico
      description: Camadas afetadas pela entrega. Remova as que não se aplicam.
      value: |
        - [ ] `entity/` — schema Prisma (e DBML correspondente no bios-docs)
        - [ ] `domain/dtos/requests/` — schemas Zod de request e response
        - [ ] `domain/dtos/repositories/` — contrato do repositório (classe abstrata)
        - [ ] `domain/dtos/errors/` — exceções do módulo (`DomainException`)
        - [ ] `infra/db/repositories/` — implementação Prisma (`PrismaRepository`)
        - [ ] `infra/usecases/` — caso de uso (`UseCase<TInput, TOutput>`)
        - [ ] `http/controllers/` — endpoints (`@ResponseSchema`, `@ErrorResponses`)
        - [ ] `infra/modules/` — registro no módulo
        - [ ] Variáveis de ambiente (`environment.config.ts` e `.env.example`)
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critérios de aceite
      description: Um item por fluxo normal, fluxo alternativo e regra de negócio do caso de uso.
      value: |
        - [ ] Fluxo normal:
        - [ ] Fluxo alternativo:
        - [ ] Regra de negócio:
    validations:
      required: true

  - type: checkboxes
    id: tests
    attributes:
      label: Testes previstos
      description: Tipos de teste da entrega — os mesmos das etiquetas do quadro no GitHub Projects.
      options:
        - label: Unitário
        - label: Integração
        - label: E2E
        - label: Funcional

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definição de pronto
      value: |
        - [ ] Critérios de aceite atendidos
        - [ ] Lint, typecheck e testes passando no CI
        - [ ] Cobertura mínima de 75% mantida (NFPD03)
        - [ ] Documentação OpenAPI gerada pelos schemas de request e response
        - [ ] Nenhum dado pessoal de indivíduo exposto ou persistido (INL02)
        - [ ] Artefatos do bios-docs atualizados, caso a implementação tenha divergido deles
    validations:
      required: true
