# Infraestrutura local de desenvolvimento.
#
# O MongoDB sobe como replica set de nó único: o Prisma exige replica set para
# executar transações e as ações referenciais emuladas (ex.: cascata na exclusão
# de conta). O healthcheck inicializa o replica set na primeira execução e só
# reporta o serviço como saudável quando o nó já é primário (aceita escrita), o
# que permite aguardar o banco com `docker compose up --wait` (usado no CI).
#
# A versão do MongoDB é fixada no patch: a tag `mongo:8` anda a cada lançamento
# e faz o CI e a máquina de cada um rodarem bancos diferentes sem ninguém ter
# mexido em nada. Subir a versão é uma mudança deliberada, feita aqui.
services:
  mongodb:
    image: mongo:8.3.11
    container_name: bios-mongodb
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - bios-mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bios-redis
    ports:
      - '6379:6379'
    volumes:
      - bios-redis-data:/data
    # O healthcheck permite aguardar o Redis com `docker compose up --wait`
    # (usado no CI) antes de rodar as suítes que dependem de fila.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bios-mongodb-data:
  bios-redis-data:
